version: '3.9'

services:
  # MQTT broker for Tier 1 / Tier 2 Shelly device communication.
  # Devices dial out to this broker; we push commands and receive telemetry.
  emqx:
    image: emqx:5
    container_name: edna-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT (plain)
      - "8883:8883"    # MQTT over TLS
      - "8083:8083"    # WebSocket MQTT
      - "18083:18083"  # EMQX Dashboard (admin / public by default)
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      # Anonymous access in dev; restrict to username/password in prod
      EMQX_ALLOW_ANONYMOUS: "true"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mosquitto MQTT broker (lightweight alternative to EMQX for local dev).
  # Uncomment if you prefer Mosquitto over EMQX.
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   container_name: edna-mosquitto
  #   restart: unless-stopped
  #   ports:
  #     - "1883:1883"
  #   volumes:
  #     - ./config/mosquitto:/mosquitto/config
  #     - mosquitto_data:/mosquitto/data

volumes:
  emqx_data:
  emqx_log:
