# Issue/PR labels, synced by .github/workflows/labels.yml
# (crazy-max/ghaction-github-labeler). Priority + area + type taxonomy.

# Priority
- name: 'priority: P0'
  color: 'b60205'
  description: 'Critical — drop everything (prod down, data loss, security)'
- name: 'priority: P1'
  color: 'd93f0b'
  description: 'High — fix this cycle'
- name: 'priority: P2'
  color: 'fbca04'
  description: 'Normal'
- name: 'priority: P3'
  color: '0e8a16'
  description: 'Low / nice-to-have'

# Type
- name: 'type: bug'
  color: 'd73a4a'
  description: 'Something is broken'
- name: 'type: enhancement'
  color: 'a2eeef'
  description: 'New capability or improvement'
- name: 'type: chore'
  color: 'cfd3d7'
  description: 'Tooling, deps, docs, maintenance'
- name: 'type: security'
  color: 'b60205'
  description: 'Security-relevant'

# Area (mirrors the service split)
- name: 'area: api'
  color: '1d76db'
  description: 'apps/api (Fastify + tRPC)'
- name: 'area: csms'
  color: '1d76db'
  description: 'apps/csms (OCPP WebSocket)'
- name: 'area: worker'
  color: '1d76db'
  description: 'apps/worker (BullMQ)'
- name: 'area: mobile'
  color: '1d76db'
  description: 'apps/mobile (Expo RN)'
- name: 'area: shared'
  color: '5319e7'
  description: 'packages/* (schemas, db, server-utils, config)'
- name: 'area: payments'
  color: '5319e7'
  description: 'Stripe / Connect / payouts'
- name: 'area: ci'
  color: 'ededed'
  description: 'CI / workflows'
- name: 'area: dependencies'
  color: 'ededed'
  description: 'Dependency updates'
