name: AGENTS.md freshness

# Validates that the commands AGENTS.md / docs/RUNBOOK.md tell agents to run
# still work, so the operating manual can't silently drift from reality.
on:
  push:
    branches: [main]
    paths: ['AGENTS.md', 'docs/**', 'package.json', '**/package.json']
  pull_request:
    paths: ['AGENTS.md', 'docs/**', 'package.json', '**/package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-documented-commands:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the "Required Checks" AGENTS.md documents
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          git diff --check
