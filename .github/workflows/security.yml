name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

# Only contents:read is required. The scanners run entirely on the runner and
# publish results as workflow artifacts, so no GitHub API write / code-scanning
# (GHAS) permission is needed — those calls fail with "Resource not accessible
# by integration" when a repo caps the default token at read-only.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: |
          set -euo pipefail
          # A blocking gate on NEW secrets in this change only. Scanning the diff
          # (not the full 300+ commit history) keeps it noise-free: historical
          # lockfile hashes and the intentionally-public EXPO_PUBLIC_* client keys
          # in eas.json are allowlisted in .gitleaks.toml.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE=""
          fi
          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: $RANGE"
            gitleaks git . --config .gitleaks.toml --redact --no-banner \
              --exit-code 1 --report-format sarif --report-path gitleaks.sarif \
              --log-opts "$RANGE"
          else
            # Scheduled / first-push runs have no diff to anchor to. Scan the whole
            # history for visibility, but don't fail the job on pre-existing noise.
            echo "No diff to scan — running an informational full-history scan."
            gitleaks git . --config .gitleaks.toml --redact --no-banner \
              --exit-code 0 --report-format sarif --report-path gitleaks.sarif
          fi
      - name: Upload gitleaks report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: semgrep ci --sarif --output semgrep.sarif || true
        env:
          SEMGREP_RULES: 'p/default p/typescript p/nodejs p/secrets p/owasp-top-ten'
      # Publish findings as an artifact instead of GitHub code scanning, which
      # requires GHAS/code-scanning to be enabled on the repo.
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
