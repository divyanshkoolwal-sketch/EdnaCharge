name: Docs

on:
  push:
    branches: [main]
    paths: ['packages/**', 'typedoc.json', 'docs/openapi.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typedoc:
    name: Generate API reference (TypeDoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeDoc (shared package API reference)
        run: pnpm docs:typedoc
      - name: OpenAPI freshness
        run: pnpm openapi:check
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api-reference
          if-no-files-found: warn
