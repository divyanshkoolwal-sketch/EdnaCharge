name: Sentry → GitHub issue

# Error-to-insight pipeline: a Sentry alert rule POSTs a repository_dispatch
# (event type "sentry") with the issue payload, and this workflow opens a
# GitHub issue for triage. Configure the Sentry webhook with SENTRY_ORG /
# SENTRY_PROJECT (see docs/OBSERVABILITY.md).
on:
  repository_dispatch:
    types: [sentry]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue from a Sentry alert
        uses: actions/github-script@v7
        env:
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        with:
          script: |
            const p = context.payload.client_payload || {};
            const project = p.project || process.env.SENTRY_PROJECT || 'unknown';
            const title = `[sentry] ${p.title || p.culprit || 'New Sentry issue'}`.slice(0, 240);
            const body = [
              `**Org / Project:** ${process.env.SENTRY_ORG || '?'} / ${project}`,
              `**Level:** ${p.level || 'error'}`,
              `**Culprit:** ${p.culprit || 'n/a'}`,
              `**Sentry link:** ${p.url || p.web_url || 'n/a'}`,
              '',
              String(p.message || (p.metadata && p.metadata.value) || '').slice(0, 4000),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['type: bug', 'area: ci'],
            });
